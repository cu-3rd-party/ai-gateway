# LiteLLM Proxy: единая точка доступа к OpenRouter для сервисов и людей cu3rd.
# Ключи выдаются через self-service (`ai:` в projects/*.yaml) или вручную в /ui.
model_list:
  # Любая модель OpenRouter по её id: `openai/gpt-4o-mini` → `openrouter/openai/gpt-4o-mini`.
  # Ограничение моделей задаётся на ключе, а не здесь.
  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  callbacks: ["prometheus"]
  # Бюджетные метрики для всех ключей, а не только с трафиком.
  prometheus_initialize_budget_metrics: true
  request_timeout: 600
  json_logs: true
  set_verbose: false
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Тексты запросов/ответов в базу не пишем: только токены, стоимость и ключ.
  store_prompts_in_spend_logs: false
  disable_error_logs: true
  proxy_batch_write_at: 60
  database_connection_pool_limit: 5
  # Метрики отдаются на отдельном порту 4001 только Prometheus; на публичном 4000 — с ключом.
  require_auth_for_metrics_endpoint: true
  # Клиенты приходят через Traefik кластера.
  trusted_proxy_ranges: ["10.0.0.0/8"]
